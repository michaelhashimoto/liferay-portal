<html>
	<head>
		<meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
		<meta content="utf-8" http-equiv="encoding" />
		<meta content="Tue, 01 Jan 1980 1:00:00 GMT" http-equiv="expires" />
		<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet" />
		<link href="../css/main.css" media="screen" rel="stylesheet" type="text/css" />
		<script defer src="https://cdn.alloyui.com/3.1.0/aui/aui-min.js" type="text/javascript"></script>
		<script defer src="../js/component.js" type="text/javascript"></script>
		<script defer src="../js/main.js" type="text/javascript"></script>
	</head>
	<body>
		<div class="poshi-logger">
			<div class="sidebar" id="sidebar">
				<div class="sidebar-btn-container">
					<button class="btn btn-command-log" data-logid="01"></button>

					<button class="btn btn-sidebar"></button>

					<button class="btn btn-jump-to-details"></button>
				</div>

				<ul class="command-log" data-logid="01" id="commandLog"></ul>

				<div class="sidebar-toolbar">
					<button class="btn btn-pause">
						<span class="btn-label pause">Pause Test</span>

						<span class="btn-label continue">Continue Test</span>
					</button>
				</div>

				<div class="edit-menu">
					<div class="scope-type">
						<span class="title"></span>

						<span class="scope-name"></span>
					</div>

					<div class="parameter">
						<span class="title"></span>

						<div class="parameter-list">
						</div>
					</div>
				</div>
			</div>

			<div class="syntax-log" id="syntaxLog">
				<div class="fullscreen-image toggle" id="fullScreenImage">
					<img class="hide" id="image" src="" />
				</div>

				<ul class="syntax-log-container" id="syntaxLogContainer"></ul>
			</div>
		</div>

		<script type="text/javascript">
			function getFirstImageURL() {
				var images = document.images;

				for (var i = 0; i < images.length; i++) {
					var url = images[i].src;

					if (url.startsWith("http")) {
						return url;
					}
				}

				return;
			}

			function updateAuthUser(url, authuser) {
				var regExp = new RegExp("authuser=[^&]+");

				if (url.match(regExp)) {
					url = url.replace(regExp, "authuser=" + authuser);
				}
				else if (url.includes("?")) {
					url += "&authuser=" + authuser;
				}
				else {
					url += "?authuser=" + authuser;
				}

				return url;
			}

			function updateImageURLs() {
				var firstImageURL = getFirstImageURL();

				if (firstImageURL == null) {
					return;
				}

				for (var i = 0; i < 5; i++) {
					var image = new Image();

					image.authuser = i;

					image.onload = function() {
						if (this.width <= 0) {
							return;
						}

						var images = document.images;

						for (var i = 0; i < images.length; i++) {
							var url = images[i].src;

							if (!url.startsWith("http")) {
								continue;
							}

							images[i].src = updateAuthUser(url, this.authuser);
						}
					}

					image.src = updateAuthUser(firstImageURL, image.authuser);
				}
			}

			updateImageURLs();
		</script>
	</body>
</html>
