<html>
	<head>
		<script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.3.1.min.js" type="text/javascript">/**/</script>
		<script th:utext="${'/*<![CDATA[*/' + jsContent + '/*]]>*/'}" type="text/javascript"></script>

		<style th:utext="${'/*<![CDATA[*/' + cssContent + '/*]]>*/'}"></style>
	</head>

	<body th:with="description=${build.buildJSONObject.optString('description')}">
		<h1>Jenkins report for <a th:href="${build.buildURL}" th:text="${build.buildURL}"></a></h1>

		<h2 th:if="${!#strings.isEmpty(description)}" th:utext="${description}"></h2>

		<div th:replace="~{jenkins_report.html :: summary}"></div>

		<div th:replace="~{jenkins_report_timeline.html :: timeline}"></div>

		<table>
			<caption th:with="gitHubCommitsURL=${#strings.replace(build.workspaceGitRepository.gitHubURL, '/tree/', '/commits/')}">
				<h2>Commit history of <a th:href="${gitHubCommitsURL}" th:text="${gitHubCommitsURL}"></a></h2>
			</caption>

			<tr>
				<th></th>
				<th>Commit SHA</th>
				<th>Commit Date</th>
				<th>Commit Message</th>
				<th>Commit Diffs</th>
				<th>Build Link</th>
				<th>Build Time</th>
				<th>Build Status</th>
				<th>Build Result</th>
			</tr>

			<th:block th:with="commitGroups=${build.commitGroups},workspaceGitRepository=${build.workspaceGitRepository}">
				<th:block th:each="commitGroup, commitGroupStat : ${commitGroups}" th:with="headerLocalGitCommit=${commitGroup.get(0)},portalBuildData=${commitGroup.portalBuildData}">
					<tbody class="result-row">
						<tr>
							<td><th:block th:if="${commitGroup.size() > 1}"><label th:attr="for=${headerLocalGitCommit.SHA}">+</label><input data-toggle="toggle" th:attr="id=${headerLocalGitCommit.SHA},name=${headerLocalGitCommit.SHA}" type="checkbox" /></th:block></td>
							<td><a th:href="${workspaceGitRepository.getGitHubCommitURL(headerLocalGitCommit.SHA)}" th:text="${(commitGroupStat.first ? '*' : '') + headerLocalGitCommit.abbreviatedSHA}"></a></td>
							<td th:text="${headerLocalGitCommit.getCommitDateString('yyyy-MM-dd h:mm:ss aa z', 'PST')}"></td>
							<td th:text="${headerLocalGitCommit.message}"></td>
							<td><a th:href="${workspaceGitRepository.getGitHubCompareURL(commitGroups[commitGroupStat.index + 1].get(0).SHA, headerLocalGitCommit.SHA)}" th:if="${!commitGroupStat.last && (commitGroup.size() > 1)}" th:text="${commitGroup.size() + ' commits'}"></a></td>
							<td><a th:href="${portalBuildData.buildURL}" th:if="${portalBuildData != null}">build</a></td>
							<td th:text="${portalBuildData == null} ? null : ${portalBuildData.buildDurationString}"></td>
							<td th:text="${portalBuildData == null} ? null : ${portalBuildData.buildStatus}"></td>
							<td th:text="${portalBuildData == null} ? null : ${portalBuildData.buildResult}"></td>
						</tr>
					</tbody>

					<tbody class="hidden-row" th:if="${commitGroup.size() > 1}">
						<tr th:each="localGitCommit, localGitCommitStat : ${commitGroup}" th:if="${!localGitCommitStat.first}">
							<td></td>
							<td><a th:href="${workspaceGitRepository.getGitHubCommitURL(localGitCommit.SHA)}" th:text="${localGitCommit.abbreviatedSHA}"></a></td>
							<td th:text="${localGitCommit.getCommitDateString('yyyy-MM-dd h:mm:ss aa z', 'PST')}"></td>
							<td th:text="${localGitCommit.message}"></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
						</tr>
					</tbody>
				</th:block>
			</th:block>
		</table>

		<p><em>Indicates HEAD Commit (*)</em></p>
	</body>
</html>
