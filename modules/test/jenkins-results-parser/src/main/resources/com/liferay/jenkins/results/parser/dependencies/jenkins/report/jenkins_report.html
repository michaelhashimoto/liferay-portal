<html>
	<head>
		<style th:utext="${cssContent}"></style>

		<script language="javascript" th:utext="${jsContent}"></script>
	</head>

	<body th:with="description=${build.buildJSONObject.optString('description')}">
		<h1>Jenkins report for <a th:href="${build.buildURL}" th:text="${build.buildURL}"></a></h1>

		<h2 th:if="${!#strings.isEmpty(description)}" th:utext="${description}"></h2>

		<th:block th:with="primaryGitHubRemoteGitCommit=${build.primaryGitHubRemoteGitCommit},primaryWorkspaceGitRepository=${build.primaryWorkspaceGitRepository}">
			<div th:if="${primaryGitHubRemoteGitCommit != null}">
				<p th:text="'Sender Branch Name: ' + ${primaryWorkspaceGitRepository.senderBranchName}"></p>
				<p th:text="'Sender Branch SHA: ' + ${primaryWorkspaceGitRepository.senderBranchSHA}"></p>
				<p th:text="'Commit Message: ' + ${primaryGitHubRemoteGitCommit.message}"></p>
				<p th:text="'Commit Date: ' + ${primaryGitHubRemoteGitCommit.commitDateString}"></p>
			</div>
		</th:block>

		<div th:fragment="summary">
			<p><a th:href="${build.getCISystemStatusURL()}">CI System Status</a></p>
			<p th:text="'Start Time: ' + ${build.startTimeString}"></p>
			<p th:text="'Invocation Delay Time: ' + ${build.toDurationString(build.queuingDuration)}"></p>
			<p th:text="'Build Time: ' + ${build.toDurationString(build.duration)}"></p>
			<p th:text="'Actual CPU Usage Time: ' + ${build.toDurationString(build.totalActualDuration)}"></p>
			<p th:text="'Cached CPU Usage Time: ' + ${build.toDurationString(build.totalCachedDuration)}"></p>
			<p th:text="'Total CPU Usage Time: ' + ${build.toDurationString(build.totalDuration)}"></p>
			<p th:text="'Total number of Jenkins actual slaves used: ' + ${build.totalActualSlavesUsedCount}"></p>
			<p th:text="'Total number of Jenkins cached slaves used: ' + ${build.totalCachedSlavesUsedCount}"></p>
			<p th:text="'Total number of Jenkins slaves used: ' + ${build.totalSlavesUsedCount}"></p>
			<p th:text="'Total number of reinvocations: ' + ${build.totalReinvocationCount}"></p>
			<p th:text="'Average delay time for invoked build to start: ' + ${build.toDurationString(build.averageDelayTime)}"></p>

			<th:block th:with="longestDelayedDownstreamBuild=${build.longestDelayedDownstreamBuild}">
				<p th:if="${longestDelayedDownstreamBuild != null}">Longest delay time for invoked build to start: <a th:href="${longestDelayedDownstreamBuild.buildURL}" th:text="${longestDelayedDownstreamBuild.displayName}"></a><th:block th:text="' in: ' + ${build.toDurationString(longestDelayedDownstreamBuild.delayTime)}" /></p>
			</th:block>

			<th:block th:with="longestRunningDownstreamBuild=${build.longestRunningDownstreamBuild}">
				<p th:if="${longestRunningDownstreamBuild != null}">Longest Running Downstream Build: <a th:href="${longestRunningDownstreamBuild.buildURL}" th:text="${longestRunningDownstreamBuild.displayName}"></a><th:block th:text="' in: ' + ${build.toDurationString(longestRunningDownstreamBuild.duration)}" /></p>
			</th:block>

			<th:block th:if="${build.isJenkinsReportLongestRunningTestEnabled()}" th:with="longestRunningTest=${build.longestRunningTest}">
				<p th:if="${longestRunningTest != null}">Longest Running Test: <a th:href="${longestRunningTest.testReportURL}" th:text="${longestRunningTest.displayName}"></a><th:block th:text="' in: ' + ${build.toDurationString(longestRunningTest.duration)}" /></p>
			</th:block>
		</div>

		<div>
			<canvas height="300" id="timeline"></canvas>

			<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>
			<script th:utext="${build.jenkinsReportChartJsContent}"></script>
		</div>

		<table>
			<caption>Top Level Build - <strong th:text="${build.result != null} ? ${build.result} : ${#strings.toUpperCase(build.status)}"></strong></caption>

			<tr th:fragment="columnHeadersRow">
				<th>Name</th>
				<th>Console</th>
				<th>Test Report</th>
				<th>Start Time</th>
				<th>Build Time</th>
				<th th:if="${build.buildDurationsEnabled()}">Build Time (est)</th>
				<th th:if="${build.buildDurationsEnabled()}">Build Time (+/-)</th>
				<th>Status</th>
				<th>Result</th>
			</tr>

			<th:block th:insert="~{jenkins_report_table_rows.html :: rows(${ {build.jenkinsReportBuildInfoRow} })}" />
			<th:block th:insert="~{jenkins_report_table_rows.html :: rows(${build.jenkinsReportStopWatchRecordRows})}" />
		</table>

		<div>
			<th:block th:insert="~{:: downstreamTable ('Queued: ', null, 'queued')}" />
			<th:block th:insert="~{:: downstreamTable ('Starting: ', null, 'starting')}" />
			<th:block th:insert="~{:: downstreamTable ('Running: ', null, 'running')}" />
			<th:block th:insert="~{:: downstreamTable ('Missing: ', null, 'missing')}" />

			<h2>Completed: </h2>

			<th:block th:insert="~{:: downstreamTable ('---- Aborted: ', 'ABORTED', 'completed')}" />
			<th:block th:insert="~{:: downstreamTable ('---- Failure: ', 'FAILURE', 'completed')}" />
			<th:block th:insert="~{:: downstreamTable ('---- Missing: ', 'MISSING', 'completed')}" />
			<th:block th:insert="~{:: downstreamTable ('---- Unstable: ', 'UNSTABLE', 'completed')}" />
			<th:block th:insert="~{:: downstreamTable ('---- Success: ', 'SUCCESS', 'completed')}" />
		</div>

		<th:block th:if="${false}">
			<th:block th:fragment="downstreamTable (captionText, result, status)" th:with="rows=${build.getJenkinsReportTableRows(result, status)}">
				<table th:if="${!rows.isEmpty()}">
					<caption th:text="${captionText} + ${build.getDownstreamBuildCount(result, status)}"></caption>

					<tr th:replace="~{:: columnHeadersRow}"></tr>

					<th:block th:insert="~{jenkins_report_table_rows.html :: rows(${rows})}" />
				</table>
			</th:block>
		</th:block>
	</body>
</html>
