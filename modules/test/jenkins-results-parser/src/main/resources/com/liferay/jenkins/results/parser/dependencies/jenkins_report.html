<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<style th:utext="${cssContent}"></style>

		<script language="javascript" th:utext="${jsContent}"></script>
	</head>

	<body>
		<h1>Jenkins report for <a th:href="${buildURL}" th:text="${buildURL}"></a></h1>

		<h2 th:if="${description != null}" th:utext="${description}"></h2>

		<div th:if="${commit != null}">
			<p th:text="'Sender Branch Name: ' + ${commit.senderBranchName}"></p>
			<p th:text="'Sender Branch SHA: ' + ${commit.senderBranchSHA}"></p>
			<p th:text="'Commit Message: ' + ${commit.message}"></p>
			<p th:text="'Commit Date: ' + ${commit.date}"></p>
		</div>

		<div>
			<p th:each="summaryItem : ${summaryItems}"><th:block th:text="${summaryItem.label}" /><a th:href="${summaryItem.url}" th:if="${summaryItem.url != null}" th:text="${summaryItem.linkText}"></a><th:block th:text="${summaryItem.value}" /></p>
		</div>

		<div>
			<canvas height="300" id="timeline"></canvas>

			<script th:src="${chartJsURL}"></script>
			<script th:utext="${chartJsContent}"></script>
		</div>

		<table>
			<caption>Top Level Build - <strong th:text="${topLevelResult}"></strong></caption>

			<tr>
				<th th:each="columnHeader : ${columnHeaders}" th:text="${columnHeader}"></th>
			</tr>

			<th:block th:utext="${topLevelRowsHTML}" />
		</table>

		<div>
			<table th:each="downstreamTable : ${downstreamTables}">
				<caption th:text="${downstreamTable.caption}"></caption>

				<tr>
					<th th:each="columnHeader : ${columnHeaders}" th:text="${columnHeader}"></th>
				</tr>

				<th:block th:utext="${downstreamTable.rowsHTML}" />
			</table>

			<h2>Completed: </h2>
			<table th:each="completedDownstreamTable : ${completedDownstreamTables}">
				<caption th:text="${completedDownstreamTable.caption}"></caption>

				<tr>
					<th th:each="columnHeader : ${columnHeaders}" th:text="${columnHeader}"></th>
				</tr>

				<th:block th:utext="${completedDownstreamTable.rowsHTML}" />
			</table>
		</div>
	</body>
</html>
