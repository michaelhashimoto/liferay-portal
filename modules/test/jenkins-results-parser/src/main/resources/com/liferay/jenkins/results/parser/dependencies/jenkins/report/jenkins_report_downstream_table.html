<th:block th:fragment="downstreamTable (captionText, result, status)">
	<th:block th:if="${build != null}" th:with="downstreamBuilds=${build.getJenkinsReportDownstreamBuilds(result, status)}">
		<table th:if="${!downstreamBuilds.isEmpty()}">
			<caption th:text="${captionText} + ${build.getDownstreamBuildCount(result, status)}"></caption>

			<tr th:replace="~{jenkins_report_table_rows.html :: columnHeadersRow}"></tr>

			<th:block th:insert="~{jenkins_report_table_rows.html :: downstreamBuildsRows (${downstreamBuilds}, ${result}, ${status})}" />
		</table>
	</th:block>
</th:block>
